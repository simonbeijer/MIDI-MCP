[project]
name = "midi-mcp"
version = "0.1.0"
description = "Local MCP server for bass + voiced-comp MIDI generation into Logic Pro."
authors = [
    { name = "Simon Beijer", email = "beijer.simon@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "mido>=1.3.2",
    "music21>=9.1.0",
]

[project.scripts]
midi-mcp = "midi_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.11.12,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
